name: Checkpatch
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  checkpatch:
    name: checkpatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Perl
        run: sudo apt-get update && sudo apt-get install -y perl
      - name: Run checkpatch.pl on changed C files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          git diff --no-ext-diff --unified=0 \
            "$BASE_SHA...HEAD" \
            -- '*.c' '*.h' |
            perl scripts/checkpatch.pl --no-tree -
